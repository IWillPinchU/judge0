################################################################################
# Judge0 Configuration - 4 Languages Edition (C, C++, Java, Python)
# Hardened for Online Assessment (OA) Platforms with Cgroup v2 Support
################################################################################

# Telemetry: Disabled
JUDGE0_TELEMETRY_ENABLE=false

# Automatically restart Judge0 server if it fails
RESTART_MAX_TRIES=10
MAINTENANCE_MODE=false

# Synchronous wait support
ENABLE_WAIT_RESULT=true

# Security: Disable arbitrary compiler options to prevent compiler flag exploitation
ENABLE_COMPILER_OPTIONS=false
ENABLE_COMMAND_LINE_ARGUMENTS=false

# Batched Submissions & Suites Configuration
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=50
MAX_TEST_CASES_PER_SUITE=200

# Submissions callbacks & files
ENABLE_CALLBACKS=true
CALLBACKS_MAX_TRIES=3
CALLBACKS_TIMEOUT=5
ENABLE_ADDITIONAL_FILES=true
SUBMISSION_CACHE_DURATION=1
USE_DOCS_AS_HOMEPAGE=true

# Request/Response Encoding
# Set to true so plain text is accepted and returned by default unless base64_encoded=true is passed.
DISABLE_IMPLICIT_BASE64_ENCODING=true

################################################################################
# Worker Configuration
################################################################################
INTERVAL=0.1
MAX_QUEUE_SIZE=200

################################################################################
# Database & Cache Configuration
################################################################################
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=WN8BP4VAqFmhz3QKdmKaS8KNKR2F7wNe

POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=WN8BP4VAqFmhz3QKdmKaS8KNKR2F7wNe

################################################################################
# Sandboxed Resource Limits (Calibrated for Java 21, Python 3.11, C/C++)
################################################################################
# CPU Time limit (in seconds)
CPU_TIME_LIMIT=2.0
MAX_CPU_TIME_LIMIT=10.0
CPU_EXTRA_TIME=0.5
MAX_CPU_EXTRA_TIME=2.0
WALL_TIME_LIMIT=10.0
MAX_WALL_TIME_LIMIT=20.0

# Per-process vs Cgroup resource limit accounting:
# Defaults to true (rlimit mode). docker-entrypoint.sh flips this to false at runtime
# via OVERRIDE_PER_PROCESS_*=false when cgroup v2 setup succeeds, enabling isolate --cg mode.
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=${OVERRIDE_PER_PROCESS_TIME:-true}
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=${OVERRIDE_PER_PROCESS_MEMORY:-true}
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

# Memory limit in KB (256 MB default to accommodate JVM startup overhead)
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=524288
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000

# Process & Thread Limits
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120

# Network Security: Disabled for untrusted candidate code
ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false

# Output file size limit (in KB)
MAX_FILE_SIZE=2048
MAX_MAX_FILE_SIZE=4096

# Open file descriptor limits inside sandbox
MAX_OPEN_FILES=4096
MAX_MAX_OPEN_FILES=16384

################################################################################
# Rails Configuration
################################################################################
RAILS_ENV=production
RAILS_MAX_THREADS=5
RAILS_SERVER_PROCESSES=2

# Rails log level: debug, info, warn, error or fatal.
# Default: warn (prevents disk bloat from SQL/payload logs)
RAILS_LOG_LEVEL=warn
