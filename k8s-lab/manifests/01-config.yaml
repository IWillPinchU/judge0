apiVersion: v1
kind: Namespace
metadata:
  name: judge0
---
apiVersion: v1
kind: Secret
metadata:
  name: judge0-secrets
  namespace: judge0
type: Opaque
stringData:
  REDIS_PASSWORD: "Judge0StrongRedisPassword123"
  POSTGRES_PASSWORD: "Judge0StrongPostgresPassword123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: judge0-config
  namespace: judge0
data:
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "judge0"
  POSTGRES_USER: "judge0"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  MAINTENANCE_MODE: "false"
  ENABLE_WAIT_RESULT: "true"
  ENABLE_BATCHED_SUBMISSIONS: "true"
  MAX_SUBMISSION_BATCH_SIZE: "50"
  MAX_TEST_CASES_PER_SUITE: "100"
  ENABLE_CALLBACKS: "true"
  CALLBACKS_MAX_TRIES: "3"
  CALLBACKS_TIMEOUT: "5"
  SUBMISSION_CACHE_DURATION: "1"
  DISABLE_IMPLICIT_BASE64_ENCODING: "false"
  RAILS_ENV: "production"
  RAILS_LOG_LEVEL: "warn"
  JUDGE0_LEAN_MODE: "true"
  CPU_TIME_LIMIT: "2.0"
  MAX_CPU_TIME_LIMIT: "10.0"
  WALL_TIME_LIMIT: "10.0"
  MAX_WALL_TIME_LIMIT: "20.0"
  MEMORY_LIMIT: "262144"
  MAX_MEMORY_LIMIT: "524288"
  STACK_LIMIT: "64000"
  MAX_STACK_LIMIT: "128000"
  MAX_PROCESSES_AND_OR_THREADS: "60"
  MAX_MAX_PROCESSES_AND_OR_THREADS: "120"
  MAX_FILE_SIZE: "2048"
  MAX_MAX_FILE_SIZE: "4096"
  MAX_OPEN_FILES: "4096"
  MAX_MAX_OPEN_FILES: "16384"
  COUNT: "4"

