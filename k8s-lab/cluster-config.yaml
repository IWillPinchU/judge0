# Kind Multi-Node Cluster Configuration for Judge0 Simulation
# Simulates:
# - 1 Control Plane Node (Hosts API, DB, Redis)
# - 2 Dedicated Compute Worker Nodes (Hosts sandboxed Judge0 workers)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: judge0-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 32358
        hostPort: 23580
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker



