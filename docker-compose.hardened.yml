x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: iwillpinchu/judge0-four:v2-hardened
    volumes:
      - ./judge0.four-languages.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    environment:
      - JUDGE0_LEAN_MODE=true
    <<: *default-logging
    restart: always
    depends_on:
      - db
      - redis

  worker:
    image: iwillpinchu/judge0-four:v2-hardened
    command: ["./scripts/workers-priority"]
    volumes:
      - ./judge0.four-languages.conf:/judge0.conf:ro
    privileged: true
    environment:
      - JUDGE0_LEAN_MODE=true
      - COUNT=16
    <<: *default-logging
    restart: always
    depends_on:
      - db
      - redis

  db:
    image: postgres:16.2
    env_file: judge0.four-languages.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.four-languages.conf
    volumes:
      - redis-data:/data
    <<: *default-logging
    restart: always

volumes:
  data:
    name: judge0_postgres_data
  redis-data:
    name: judge0_redis_data

